    if (msg) { msg.className = "fin-msg"; msg.textContent = "Richtig!"; }
    state.finale = true; save();
    ui.fin.opening = true;
    burst(window.innerWidth / 2, window.innerHeight / 2, 40, true);
    setTimeout(() => { ui.fin.opening = false; render(); setTimeout(() => burst(window.innerWidth / 2, 120, 34), 200); }, reduceMotion ? 300 : 1300);
  } else {
    ui.fin.tries++;
    if (box) { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); }
    setTimeout(() => {
      ui.fin.slots = [];
      render({ keepScroll: true });
      const m = $("#finMsg");
      if (m) { m.className = "fin-msg bad"; m.textContent = "Fast! Lies die Hinweise noch einmal. · Almost, read the clues again."; }
    }, 600);
  }
}
function settingsHTML() {
  const voice = !TTS.ok ? "This browser can't play speech, so listening tasks show the text." : TTS.de.length ? `German voice: ${esc(TTS.f ? TTS.f.name : TTS.de[0].name)}` : "No German voice found, so it may sound English. Android: open Settings, search for “Text-to-speech”, then Google, Install voice data, Deutsch. iPhones have German built in. The text is always available.";
  return `<h2>Einstellungen</h2>
    <div class="setting"><div><b>Pausen-Erinnerung</b><span>A gentle nudge after 15 minutes of playing.</span></div>
      <label class="switch"><input type="checkbox" data-change="toggle-breaks" ${state.settings.breaks ? "checked" : ""} aria-label="Pausen-Erinnerung"><i></i></label></div>
    <div class="setting"><div><b>Prüfungsmodus</b><span>Listening plays only as often as in the real exam.</span></div>
      <label class="switch"><input type="checkbox" data-change="toggle-strict" ${state.settings.strict ? "checked" : ""} aria-label="Prüfungsmodus"><i></i></label></div>
    <div class="setting"><div><b>Sprechtempo</b><span>Slower is easier to follow.</span></div>
      <div class="seg"><button data-action="rate" data-rate="0.75" aria-pressed="${state.settings.rate < 0.85}">Langsam</button><button data-action="rate" data-rate="0.9" aria-pressed="${state.settings.rate >= 0.85}">Normal</button></div></div>
    <div class="setting"><div><b>Stimme testen</b><span>Check your sound before the listening letters.</span></div><button class="btn soft" data-action="test-voice">${icon("i-speaker")}Test</button></div>
    <p class="fineprint">${voice}</p>
    <div class="setting" id="resetBox"><div><b class="danger">Neu anfangen</b><span>Delete all progress on this phone.</span></div><button class="btn soft" data-action="reset-ask">Löschen</button></div>`;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = actions[el.dataset.action];
  if (!a) return;
  if (el.getAttribute("aria-disabled") === "true") {
    if (el.dataset.action === "open-stage") toast("Dieser Brief ist noch verschlossen. Open the one before it first.");
    else toast("Collect all eleven clues first. Der letzte Brief ist noch zu.");
    return;
  }
  e.preventDefault();
  a(el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.change && actions[el.dataset.change]) actions[el.dataset.change](el);
  if (el.dataset && el.dataset.field && el.type === "radio") ui.form[el.dataset.field] = el.value;
  if (el.dataset && el.dataset.pt !== undefined) ui.pts[+el.dataset.pt] = el.checked;
});
let draftT = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.field && el.type !== "radio") ui.form[el.dataset.field] = el.value;
  if (el.id === "letterTxt") {
    const t = el.value;
    state.draft = t;
    clearTimeout(draftT); draftT = setTimeout(save, 400);
    const wc = $("#wcNum"); if (wc) wc.textContent = wordCount(t) + " Wörter";
    const ch = $("#checks"); if (ch) ch.innerHTML = checksHTML(t);
    const b = $("#writeBtn"); if (b) b.disabled = wordCount(t) < 8;
  }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.dataset.form === "typed") {
    e.preventDefault();
    const tv = ($("#typedAns").value || "").trim();
    if (!tv || ui.answered) return;
    ui.typedVal = tv;
    const ok = curQ().check(tv);
    if (ok) burstFrom($("#typedAns"), 12);
    return answer(ok, ok ? 1 : 0);
  }
  if (f.dataset.form !== "name") return;
  e.preventDefault();
  const v = ($("#herName").value || "").trim().replace(/\s+/g, " ").slice(0, 24).replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase("de-DE"));
  if (!v) { $("#nameErr").hidden = false; return; }
  state.herName = v;
  ui.fbWord = ["Freut mich, " + v + "!", "Nice to meet you!"];
  ui.answered = true; ui.lastOk = true;
  ui.correct += 1; state.petals += 1;
  state.cur = { stage: ui.stage, qi: ui.qi + 1, correct: ui.correct };
  save();
  render({ keepScroll: true });
  burstFrom($("#fb"), 12);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* =====================================================================
   Falling petals
   ===================================================================== */
(function petals() {
  const cvs = $("#petals"); if (!cvs || !cvs.getContext) return;
  const ctx = cvs.getContext("2d");
  const colors = ["#F7B3C8", "#FBCAD7", "#FFD5C2", "#F59AB5", "#FFE1E8", "#FBC0A8"];
  let W = 0, H = 0, ps = [], raf = 0, last = 0;
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
    cvs.style.width = W + "px"; cvs.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const want = Math.round(Math.min(22, Math.max(10, W / 24)));
    while (ps.length < want) ps.push(spawn({}, true));
    ps.length = want;
    if (reduceMotion) draw();
  }
  function spawn(p, initial) {
    p.x = Math.random() * W; p.y = initial ? Math.random() * H : -20 - Math.random() * 40;
    p.s = 8 + Math.random() * 9; p.vy = 18 + Math.random() * 26; p.vx = 6 + Math.random() * 14;
    p.rot = Math.random() * 6.28; p.vr = (Math.random() - .5) * 1.2; p.flip = Math.random() * 6.28; p.vf = .6 + Math.random() * 1.6;
    p.sw = Math.random() * 6.28; p.c = colors[Math.floor(Math.random() * colors.length)]; p.a = .5 + Math.random() * .4;
    return p;
  }
  function petal(p) {
    const s = p.s;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(.25 + Math.abs(Math.cos(p.flip)) * .75, 1);
    ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.moveTo(0, s * .55);
    ctx.bezierCurveTo(-s * .62, s * .2, -s * .58, -s * .5, -s * .2, -s * .62);
    ctx.lineTo(0, -s * .44); ctx.lineTo(s * .2, -s * .62);
    ctx.bezierCurveTo(s * .58, -s * .5, s * .62, s * .2, 0, s * .55);
    ctx.fill(); ctx.restore();
  }
  function draw() { ctx.clearRect(0, 0, W, H); ps.forEach(petal); }
  function tick(t) {
    const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    for (const p of ps) {
      p.y += p.vy * dt; p.x += (p.vx + Math.sin(t / 900 + p.sw) * 16) * dt;
      p.rot += p.vr * dt; p.flip += p.vf * dt;
      if (p.y > H + 30 || p.x > W + 30) spawn(p, false), p.x = Math.random() * W * .9 - 40;
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  window.addEventListener("resize", resize);
  resize();
  if (!reduceMotion) {
    raf = requestAnimationFrame(tick);
    document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { last = 0; raf = requestAnimationFrame(tick); } });
  }
})();

/* golden petal: appears now and then on the title and tree screens */
function scheduleGolden(delay) {
  setTimeout(() => {
    if (state.secrets.includes("golden")) return;
    if (document.hidden || !["title", "map", "box"].includes(ui.screen) || $("#golden")) { scheduleGolden(15000); return; }
    const b = document.createElement("button");
    b.id = "golden"; b.className = "golden" + (reduceMotion ? " still" : "");
    b.setAttribute("data-action", "secret-golden");
    b.setAttribute("aria-label", "Ein goldenes Blütenblatt");
    b.innerHTML = `<svg viewBox="-30 -46 60 50" aria-hidden="true"><path d="M0 0C-16-8-21-31-8-43L0-36 8-43C21-31 16-8 0 0Z" fill="url(#gGold)" stroke="#C98A1E" stroke-width="1.5"/></svg>`;
    b.style.setProperty("--x0", (8 + Math.random() * 45) + "vw");
    document.body.appendChild(b);
    const done = () => { if (b.isConnected) b.remove(); scheduleGolden(55000 + Math.random() * 40000); };
    if (reduceMotion) setTimeout(done, 9000); else b.addEventListener("animationend", done);
  }, delay);
}

/* break reminder after 15 minutes of active play */
let activeMs = 0, reminded = false;
setInterval(() => {
  if (document.hidden) return;
  activeMs += 30000;
  if (!reminded && state.settings.breaks && activeMs >= 15 * 60000 && ui.screen !== "title") {
    reminded = true;
    openSheet(`<h2>15 Minuten! Kleine Pause?</h2><p>You've been playing for 15 minutes. Stretch, drink a glass of water, and maybe go back to your notes for a bit. Your progress is saved.</p><div class="actions"><button class="btn" data-action="pause">Pause machen</button><button class="btn soft" data-action="close-sheet">Noch kurz weiter</button></div>`);
  }
}, 30000);

/* redraw the branch when the layout changes */
let roT = null;
try { new ResizeObserver(() => { clearTimeout(roT); roT = setTimeout(() => { if (ui.screen === "map") drawBranch(); }, 60); }).observe(app); } catch (e) {}
window.addEventListener("resize", () => { if (ui.screen === "map") drawBranch(); });

/* =====================================================================
   Boot
   ===================================================================== */
function start(data) {
  try { if (data && data.ui) Object.assign(ui, data.ui); } catch (e) {}
  TTS.init();
  render();
  scheduleGolden(30000 + Math.random() * 15000);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ ui: JSON.parse(JSON.stringify(ui)) })); } catch (e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
