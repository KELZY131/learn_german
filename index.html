<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Der Kirschblütenbrief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFF4F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,96,600,100,1;1,96,500,100,1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  /* Layout: one storybook column (max 30rem) over a blush-to-peach sky; the letters hang on a sakura branch that blooms as she goes. */
  --sky-top:#FFF4F0;
  --sky-mid:#FDE3E8;
  --sky-low:#FFE0CF;
  --paper:#FFFCF8;
  --card:#FFFFFF;
  --blush:#FDE6EA;
  --peach:#FFD6C2;
  --peach-deep:#F4A27F;
  --sakura:#F39BB6;
  --rose:#C8476E;
  --rose-deep:#A3375A;
  --ink:#57293A;
  --ink-soft:#86566A;
  --line:#F2CBD5;
  --bark:#8E5B57;
  --gold:#E2AE4E;
  --ok:#2F7D5B; --ok-bg:#E2F3E9;
  --bad:#B93B5A; --bad-bg:#FDE5EA;
  --font-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --font-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --r-lg:24px; --r-md:16px;
  --shadow:0 14px 34px -20px rgba(160,60,95,.55),0 0 0 1px rgba(236,180,198,.55);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55;color:var(--ink);background:var(--sky-top);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#FFF4F0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sakura);outline-offset:2px;border-radius:12px}
.sky{position:fixed;inset:0;z-index:-2;background:radial-gradient(120% 55% at 90% -5%,#FFE3D3 0%,rgba(255,227,211,0) 60%),radial-gradient(90% 50% at 0% 100%,#FFD9C9 0%,rgba(255,217,201,0) 70%),linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%)}
#petals{position:fixed;inset:0;z-index:-1;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,244,240,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(242,203,213,.7)}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 6px 4px 0;cursor:pointer;min-width:0}
.brand svg{width:26px;height:26px;flex:none}
.brand span{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-chips{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.chip-hud{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;border:0;cursor:pointer}
.chip-hud svg{width:18px;height:18px}
span.chip-hud{cursor:default}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);cursor:pointer;flex:none}
.icon-btn svg{width:19px;height:19px}
.ico{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:370px){.brand span{display:none}.chip-hud{padding:0 8px}}

/* ---------- Layout ---------- */
.app{max-width:30rem;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{margin:0;font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--rose)}
.h1{margin:4px 0 6px;font-family:var(--font-display);font-weight:600;font-size:clamp(1.7rem,7vw,2.15rem);line-height:1.12;text-wrap:balance;letter-spacing:-.01em}
.h1 em{font-style:italic;font-weight:500;color:var(--rose)}
.sub{margin:0;color:var(--ink-soft)}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.actions.center{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 24px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-weight:800;font-size:1.02rem;cursor:pointer;box-shadow:0 5px 0 var(--rose-deep),0 12px 22px -12px rgba(163,55,90,.8);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--rose-deep)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line) inset}
.btn.soft:active{box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line) inset}
.btn.wide{flex:1 1 180px}
.btn svg{width:18px;height:18px}
.link{border:0;background:none;padding:6px 2px;color:var(--rose);font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- Title ---------- */
.title-screen{position:relative;text-align:center;padding-top:4px}
.hero-branch{display:block;width:calc(100% + 32px);margin:0 -16px -6px;max-width:none;height:auto}
.cloud{position:absolute;top:2px;right:-4px;width:84px;height:48px;border:0;background:none;padding:0;cursor:pointer;animation:float 6s ease-in-out infinite}
.cloud svg{width:100%;height:100%}
@keyframes float{50%{transform:translateY(-5px)}}
.for{margin:2px 0 0;font-family:var(--font-hand);font-size:1.6rem;color:var(--rose);line-height:1}
.title{margin:2px 0 8px;font-family:var(--font-display);font-weight:600;font-size:clamp(2.4rem,12vw,3.5rem);line-height:.98;letter-spacing:-.02em;text-wrap:balance}
.title small{display:block;font-size:.42em;font-style:italic;font-weight:500;color:var(--rose);letter-spacing:0;margin-bottom:4px}
.title .soft-i{font-style:italic;font-weight:500}
.lede{max-width:24rem;margin:0 auto;font-size:1.05rem;text-wrap:balance}
.lede-en{max-width:24rem;margin:6px auto 0;color:var(--ink-soft);font-size:.92rem;text-wrap:balance}
.countdown{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:7px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:.88rem;font-variant-numeric:tabular-nums}
.countdown b{color:var(--rose)}
.env-static{width:min(220px,62vw);margin:22px auto 4px;filter:drop-shadow(0 14px 18px rgba(200,71,110,.22))}
.env-static svg{width:100%;height:auto;display:block}
.title-screen .actions{justify-content:center}
.foot{margin:22px 0 0;font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--ink-soft)}

/* ---------- Map ---------- */
.map-head{margin-bottom:6px}
.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-top:12px}
.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--sakura),var(--peach-deep));transition:width .6s}
.tree{position:relative;padding-top:78px;margin-top:8px}
.tree-svg{position:absolute;left:0;top:0;width:100%;overflow:visible;pointer-events:none}
.branch-main{fill:none;stroke:var(--bark);stroke-width:7;stroke-linecap:round}
.branch-hi{fill:none;stroke:#B98580;stroke-width:2;stroke-linecap:round;opacity:.6}
.twig{fill:none;stroke:var(--bark);stroke-width:3.5;stroke-linecap:round}
.cat{position:absolute;top:4px;left:4px;width:64px;height:58px;border:0;background:none;padding:0;cursor:pointer;z-index:2}
.cat svg{width:100%;height:100%;overflow:visible}
.cat .tail{transform-origin:46px 44px;animation:tail 3.2s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(14deg)}}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:12px;position:relative}
.row-btn{display:grid;grid-template-columns:68px minmax(0,1fr);align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.node{position:relative;width:68px;height:68px;display:grid;place-items:center}
.node svg{width:58px;height:58px;overflow:visible}
.row.current .node::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(243,155,182,.55),rgba(243,155,182,0) 70%);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18);opacity:.6}}
.row.done .node svg{animation:none}
.row-card{display:block;padding:12px 14px;border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow);min-width:0;transition:transform .15s}
.row-btn:hover .row-card{transform:translateX(2px)}
.row.current .row-card{box-shadow:0 0 0 2px var(--rose),0 16px 30px -18px rgba(200,71,110,.7)}
.row.locked .row-card{background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(236,180,198,.6)}
.row.locked .row-title,.row.locked .row-meta{color:var(--ink-soft)}
.row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row-eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.skill{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.skill-hoeren{background:#FFE2D3;color:#9A4A2C}
.skill-lesen{background:#FDE0E8;color:#9E3557}
.skill-schreiben{background:#F7E1F0;color:#83386E}
.skill-sprechen{background:#FFEBCB;color:#8A5A12}
.skill-finale{background:var(--rose);color:#fff}
.row-title{display:block;margin-top:2px;font-family:var(--font-display);font-weight:600;font-size:1.12rem;line-height:1.25}
.row-meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:.86rem;font-weight:700;color:var(--ink-soft)}
.row.current .row-meta{color:var(--rose)}
.stars-sm{display:inline-flex;gap:2px}
.stars-sm svg{width:16px;height:16px}
.st-on{fill:var(--gold)}
.st-off{fill:#EBD5DA}
.row-meta svg.ico{width:15px;height:15px}

/* ---------- Stage chrome ---------- */
.stage-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stage-top .meta{display:flex;flex-direction:column;min-width:0}
.stage-top .meta b{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.stage-top .meta span{font-size:.9rem;color:var(--ink-soft);font-weight:700}
.qdots{display:flex;gap:6px;margin:0 0 14px}
.qdots i{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line)}
.qdots i.on{background:var(--sakura);box-shadow:none}
.qdots i.now{background:var(--peach-deep);box-shadow:none}
.qcard{padding:18px 16px 18px}
.prompt{margin:16px 0 0;font-family:var(--font-display);font-weight:600;font-size:1.22rem;line-height:1.3;text-wrap:balance}
.prompt-sub{margin:4px 0 0;font-size:.9rem;color:var(--ink-soft)}
.sentence{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--blush);font-weight:700;font-size:1.08rem}
.blank{display:inline-block;min-width:4.2em;border-bottom:2.5px dashed var(--rose);color:var(--rose);text-align:center}
.ctx + .prompt{margin-top:18px}

/* options */
.opts{display:grid;gap:10px;margin-top:16px}
.opts.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--card);font-weight:700;font-size:1rem;line-height:1.35;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--sakura);transform:translateY(-1px)}
.opt[disabled]{cursor:default}
.opt .badge{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--rose-deep);font-weight:800;font-size:.85rem}
.opts.tf .opt{justify-content:center;font-size:1.05rem;font-weight:800}
.opt.is-right{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-right .badge{background:var(--ok);color:#fff}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .badge{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.clock-opt{flex-direction:column;justify-content:center;gap:6px;padding:10px 6px;text-align:center}
.clock{width:100%;max-width:76px;height:auto}
.clock-face{fill:#FFF8F5;stroke:var(--ink);stroke-width:3}
.clock-ticks line{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.clock-h{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.clock-m{stroke:var(--rose);stroke-width:3;stroke-linecap:round}
.clock-pin{fill:var(--ink)}
.clock-lbl{font-variant-numeric:tabular-nums;font-weight:800}
.opt.web-opt{flex-direction:column;align-items:stretch;gap:8px;padding:10px}
.web-opt .web-row{display:flex;align-items:center;gap:8px}
.web{display:block;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;font-weight:600}
.web-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--blush);font-size:.78rem;color:var(--ink-soft);font-weight:800;min-width:0}
.web-bar .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.web-body{padding:8px 12px 10px;font-size:.92rem;line-height:1.45}
.web-body b{display:block;font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.dots{display:inline-flex;gap:4px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:#F5B5C6}
.dots i:nth-child(2){background:#FBCDB5}
.dots i:nth-child(3){background:#F3D9A7}
.train{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums;background:#fff;border-radius:10px;overflow:hidden}
.train th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);text-align:left;padding:6px 8px;background:var(--blush)}
.train td{padding:6px 8px;border-top:1px solid var(--line)}
.train td:first-child{font-weight:800;color:var(--rose)}

/* contexts */
.ctx{margin:0}
.mail{border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:#fff}
.mail-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--blush);font-size:.84rem;color:var(--ink-soft);font-weight:800}
.mail-body{padding:12px 14px;font-size:.98rem;line-height:1.62}
.mail-body p{margin:0 0 8px}
.mail-body p:last-child{margin:0}
.menu{position:relative;background:#FFF8F1;border:2px dashed #EFB39C;border-radius:18px;padding:16px 14px;text-align:center}
.menu h3{margin:0 0 6px;font-family:var(--font-display);font-style:italic;font-weight:500;font-size:1.35rem;color:var(--rose-deep)}
.menu p{margin:2px 0;font-weight:700}
.menu p.small{font-size:.85rem;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sign{margin:0 auto;max-width:310px}
.sign figcaption{text-align:center;font-size:.85rem;color:var(--ink-soft);font-weight:700;margin-bottom:8px}
.sign figcaption b{font-style:italic;color:var(--ink)}
.board{transform:rotate(var(--tilt,0deg));background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:7px 7px 0 rgba(87,41,58,.13);padding:14px 12px;text-align:center}
.board h3{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:1.3rem}
.board p{margin:2px 0;font-weight:700;font-variant-numeric:tabular-nums}
.examcard{max-width:290px;margin:0 auto;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.ec-head{display:flex;font-size:.7rem;font-weight:800}
.ec-head span{flex:1;padding:5px 8px}
.ec-head span:first-child{background:var(--ink);color:#fff}
.ec-head span:last-child{background:var(--peach);text-align:right}
.ec-theme{background:var(--blush);text-align:center;font-weight:800;font-size:.86rem;padding:5px}
.ec-word{font-family:var(--font-display);font-weight:600;font-size:2.15rem;text-align:center;padding:24px 10px;line-height:1.1;overflow-wrap:anywhere}
.ec-pic{display:grid;place-items:center;padding:16px}
.ec-pic svg{width:120px;height:120px}
.pl{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pf{fill:#FBD3DD}
.pf2{fill:#FFE1CF}
.pw{fill:#D8E9F5}
.task{border-radius:16px;background:#FFF6F8;border:1.5px solid var(--line);padding:14px}
.task p{margin:0 0 8px}
.task p:last-child{margin:0}
.task ul{margin:6px 0 8px;padding-left:1.2em}
.en{color:var(--ink-soft);font-size:.9rem;font-style:italic}
.toggle-en{margin-top:6px}

/* listening */
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#FFF0EA,#FDE6EE)}
.play{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:10px 20px 10px 14px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--rose-deep)}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 var(--rose-deep)}
.play .disc{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.play svg{width:18px;height:18px}
.bars{display:none;align-items:flex-end;gap:2px;height:16px}
.bars i{width:3px;background:#fff;border-radius:2px;animation:bar .8s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes bar{0%,100%{height:4px}50%{height:16px}}
.play.playing .bars{display:inline-flex}
.play.playing .disc{display:none}
.listen-meta{font-size:.84rem;font-weight:700;color:var(--ink-soft);line-height:1.35}
.listen-meta b{color:var(--ink)}
.listen .link{font-size:.86rem;padding:2px 0}
.transcript{margin-top:10px;width:100%;padding:12px 14px;border-radius:14px;background:#fff;border:1.5px dashed var(--line);font-size:.95rem}
.transcript p{margin:0 0 6px}
.transcript p:last-child{margin:0}
.transcript .who{font-weight:800;color:var(--rose);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.voice-note{width:100%;font-size:.82rem;color:var(--ink-soft);margin:0}

/* feedback */
.feedback{margin-top:16px;padding:14px 16px 16px;border-radius:18px;animation:fadeUp .35s}
.feedback.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 2px rgba(47,125,91,.35)}
.feedback.bad{background:var(--bad-bg);box-shadow:inset 0 0 0 2px rgba(185,59,90,.3)}
.fb-title{margin:0;font-size:1.15rem}
.feedback.ok .fb-title strong{color:var(--ok)}
.feedback.bad .fb-title strong{color:var(--bad)}
.fb-title span{font-size:.88rem;color:var(--ink-soft);font-weight:700;margin-left:4px}
.fb-explain{margin:6px 0 0}
.feedback .btn{margin-top:14px;width:100%}

/* input / form / write */
.field-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-weight:800;font-size:1.1rem}
.txt{font:inherit;font-size:1.05rem;font-weight:700;color:var(--ink);padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#FFF9FA;min-width:0;width:100%}
.txt:focus{outline:none;border-color:var(--sakura);box-shadow:0 0 0 4px rgba(243,155,182,.25)}
.field-row .txt{flex:1 1 160px;width:auto}
.err{margin:8px 0 0;color:var(--bad);font-weight:700;font-size:.9rem}
.form-sheet{border:2px solid var(--ink);border-radius:14px;padding:14px;background:#fff;margin-top:14px}
.form-sheet h3{margin:0 0 2px;text-align:center;font-family:var(--font-display);font-weight:600;font-size:1.3rem;color:var(--rose-deep)}
.form-sheet .fs-sub{margin:0 0 12px;text-align:center;font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.frow label,.frow .lbl{grid-column:1/-1;font-size:.84rem;font-weight:800;color:var(--ink-soft)}
.frow .given{padding:9px 12px;border-radius:10px;background:#F3E6E9;font-weight:700}
.frow .num{font-weight:800;color:var(--rose);font-size:.9rem;font-variant-numeric:tabular-nums}
.frow .inline{display:flex;gap:8px;min-width:0}
.frow .inline .given{flex:none}
.frow .txt.ok{border-color:var(--ok);background:var(--ok-bg)}
.frow .txt.bad{border-color:var(--bad);background:var(--bad-bg)}
.sol{grid-column:1/-1;font-size:.86rem;font-weight:700;margin:2px 0 0}
.sol.ok{color:var(--ok)}
.sol.bad{color:var(--bad)}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:2px solid var(--line);font-weight:800;color:var(--ink);font-size:.95rem;cursor:pointer;grid-column:auto}
.radios input{accent-color:var(--rose);width:18px;height:18px;margin:0}
.radios label.ok{border-color:var(--ok);background:var(--ok-bg)}
.radios label.bad{border-color:var(--bad);background:var(--bad-bg)}
textarea.txt{min-height:190px;resize:vertical;line-height:1.55;font-weight:600}
.wc{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.88rem;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.checks span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#F6EAED;font-size:.82rem;font-weight:800;color:var(--ink-soft)}
.checks span svg{width:14px;height:14px}
.checks span.on{background:var(--ok-bg);color:var(--ok)}
.scoring{margin-top:12px;padding:12px 14px;border-radius:14px;background:#FFF6EC;font-size:.9rem}
.scoring h4{margin:0 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.scoring p{margin:0}

/* letters */
.letter{position:relative;padding:26px 20px 22px;border-radius:6px 6px 14px 14px;background-color:#FFFDF8;background-image:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 33px,#F6DCE2 33px 34px);background-position:0 18px;box-shadow:0 18px 34px -22px rgba(150,60,90,.6),0 0 0 1px #F3DADF}
.letter::before{content:"";position:absolute;top:-10px;left:50%;width:96px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(243,155,182,.55);border-radius:3px}
.hand{font-family:var(--font-hand);font-size:1.5rem;line-height:34px;font-weight:500;color:#5E2C40}
.hand p{margin:0}
.hand p + p{margin-top:0}
.sig{font-family:var(--font-hand);font-size:1.7rem;font-weight:700;color:var(--rose);margin-top:4px}
.letter .en{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.55;font-size:.92rem}
.letter-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.8rem;cursor:pointer;color:var(--ink)}
.chip svg{width:16px;height:16px;flex:none}
.chip[aria-pressed="true"]{background:var(--blush);border-color:var(--sakura)}
.pressed{position:absolute;right:10px;bottom:8px;width:46px;height:46px;opacity:.85;transform:rotate(18deg)}
details.tip{margin-top:16px;border-radius:16px;background:rgba(255,255,255,.75);box-shadow:0 0 0 1.5px var(--line)}
details.tip summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:.92rem;list-style:none;display:flex;align-items:center;gap:8px}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";margin-left:auto;font-size:1.2rem;color:var(--rose)}
details.tip[open] summary::after{content:"–"}
details.tip p{margin:0;padding:0 14px 14px;font-size:.94rem}
.tip-ico{width:24px;height:24px;border-radius:50%;background:var(--peach);display:grid;place-items:center;flex:none}
.tip-ico svg{width:14px;height:14px}

/* envelope */
.intro{text-align:center;padding-top:6px}
.env{position:relative;display:block;width:min(300px,80vw);aspect-ratio:10/7;margin:28px auto 10px;padding:0;border:0;background:none;cursor:pointer;perspective:900px}
.env-back{position:absolute;inset:0;border-radius:12px;background:#F6B49C}
.env-paper{position:absolute;left:7%;right:7%;top:8%;bottom:7%;border-radius:8px;background:#FFFDF8;background-image:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 15px,#F6DCE2 15px 16px);z-index:2;transition:transform .8s .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px rgba(150,60,90,.15)}
.env-front{position:absolute;inset:0;border-radius:12px;z-index:3;background:linear-gradient(160deg,#FFD9C6,#FBC2AE);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;background:linear-gradient(180deg,#FBC7B2,#F7B39C);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .6s ease,z-index 0s .3s;border-radius:12px 12px 0 0}
.env-seal{position:absolute;left:50%;top:60%;width:62px;height:62px;transform:translate(-50%,-50%);z-index:5;transition:transform .35s,opacity .35s;filter:drop-shadow(0 3px 4px rgba(120,30,60,.35))}
.env-seal svg{width:100%;height:100%}
.env:not(.open) .env-seal{animation:seal 2.4s ease-in-out infinite}
@keyframes seal{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env.open .env-seal{opacity:0;transform:translate(-50%,-50%) scale(.5)}
.env.open .env-paper{transform:translateY(-42%)}
.hint{margin:6px 0 0;font-weight:800;color:var(--rose);font-size:.92rem}
.hint span{display:block;color:var(--ink-soft);font-weight:700;font-size:.84rem}

/* reward */
.reward{text-align:center}
.bloom{width:120px;height:120px;margin:4px auto 0;animation:bloom 1s cubic-bezier(.2,1.4,.4,1) both}
.bloom svg{width:100%;height:100%;overflow:visible}
@keyframes bloom{from{transform:scale(.2) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 4px}
.stars svg{width:38px;height:38px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stars svg:nth-child(2){animation-delay:.15s}.stars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.score{margin:0;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.reward .letter{text-align:left;margin-top:22px}
.clue{margin-top:18px;padding:18px 16px;border-radius:20px;background:linear-gradient(150deg,#FFFFFF,#FFF1F4);box-shadow:var(--shadow);text-align:left;animation:turn .8s .25s cubic-bezier(.2,.8,.2,1) both;position:relative;overflow:hidden}
@keyframes turn{from{transform:perspective(700px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.clue .eyebrow{display:flex;align-items:center;gap:6px}
.clue .eyebrow svg{width:16px;height:16px}
.clue-de{margin:8px 0 2px;font-family:var(--font-display);font-weight:600;font-size:1.3rem;line-height:1.3;text-wrap:balance}
.clue .en{margin:0}
.clue .corner{position:absolute;right:-14px;top:-14px;width:70px;height:70px;opacity:.5}
.petal-letter{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border-radius:20px;background:#FFF7EE;box-shadow:inset 0 0 0 1.5px #F7D3B9;text-align:left;animation:fadeUp .5s .6s both}
.petal-letter .pl-big{position:relative;width:62px;height:66px;flex:none}
.petal-letter .pl-big svg{width:100%;height:100%}
.petal-letter .pl-big b{position:absolute;inset:0;display:grid;place-items:center;padding-top:8px;font-family:var(--font-display);font-size:1.6rem;color:var(--rose-deep)}
.petal-letter p{margin:0;font-weight:700}
.petal-letter p span{display:block;font-weight:600;color:var(--ink-soft);font-size:.88rem}
.encourage{margin:18px 0 0;font-family:var(--font-hand);font-size:1.6rem;color:var(--rose);line-height:1.15}
.encourage span{display:block;font-family:var(--font-body);font-size:.85rem;color:var(--ink-soft)}
.break{margin-top:18px;padding:16px;border-radius:20px;background:#fff;box-shadow:0 0 0 2px var(--peach),var(--shadow);text-align:left}
.break h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.2rem}
.break p{margin:6px 0 0;font-size:.95rem}
.break .actions{margin-top:12px}

/* finale */
.fin-clues{margin-top:16px;border-radius:18px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1.5px var(--line)}
.fin-clues summary{cursor:pointer;padding:12px 14px;font-weight:800}
.fin-clues ol{margin:0;padding:0 14px 14px 2.2em;display:grid;gap:8px}
.fin-clues li{font-weight:700}
.fin-clues li span{display:block;font-weight:600;font-style:italic;color:var(--ink-soft);font-size:.88rem}
.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.slot{width:48px;height:56px;border-radius:14px;border:2.5px dashed var(--sakura);background:rgba(255,255,255,.75);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:1.7rem;color:var(--rose-deep);cursor:pointer;padding:0}
.slot.filled{border-style:solid;background:#fff}
.slots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.slots.win .slot{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.pletters{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px}
.pbtn{position:relative;width:58px;height:62px;border:0;background:none;padding:0;cursor:pointer;transition:transform .2s,opacity .2s}
.pbtn svg{width:100%;height:100%}
.pbtn b{position:absolute;inset:0;display:grid;place-items:center;padding-top:6px;font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:var(--rose-deep)}
.pbtn:hover:not([disabled]){transform:translateY(-3px) rotate(-4deg)}
.pbtn[disabled]{opacity:.25;cursor:default}
.fin-msg{min-height:1.6em;margin:12px 0 0;text-align:center;font-weight:800}
.fin-msg.bad{color:var(--bad)}
.reveal{text-align:center}
.reveal-name{margin:4px 0 0;font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,10vw,2.8rem);line-height:1.05}
.reveal-name span{display:block;font-style:italic;font-weight:500;color:var(--rose)}
.reveal .letter{text-align:left;margin-top:24px}
.reveal .hand p{margin-bottom:34px}
.reveal .hand p:last-child{margin-bottom:0}
.bonus{margin-top:22px;padding:18px 16px;border-radius:22px;background:linear-gradient(150deg,#FFF3EC,#FDE6EE);text-align:left}
.bonus .bonus-de{margin:8px 0 2px;font-family:var(--font-display);font-weight:600;font-size:1.35rem;line-height:1.25}
.bonus p{margin:0}
.bonus .note{margin-top:10px;font-size:.95rem}
.bonus .chip{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{padding:12px 6px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--font-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.practised{margin-top:16px;font-size:.92rem;color:var(--ink-soft);font-weight:700}
.practised .skills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}

/* box */
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1.5px var(--line);margin:14px 0 16px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:none;padding:9px 12px;border-radius:999px;font-weight:800;font-size:.88rem;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--rose);color:#fff}
.list{display:grid;gap:10px}
.item{padding:14px 16px;border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.item .eyebrow{margin-bottom:4px}
.item .de{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.12rem;line-height:1.3}
.item .en{margin:2px 0 0}
.item.locked{background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(236,180,198,.6)}
.item.locked .de{color:var(--ink-soft);font-family:var(--font-body);font-weight:700;font-size:.95rem}
.collected{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.collected span{width:38px;height:42px;display:grid;place-items:center;border-radius:12px;background:#FFF1F4;font-family:var(--font-display);font-weight:600;font-size:1.2rem;color:var(--rose-deep);box-shadow:inset 0 0 0 1.5px var(--line)}
.collected span.empty{color:#D9AEBB}
.wgroup h3{margin:6px 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.word{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);margin-bottom:6px}
.word button{width:36px;height:36px;border-radius:50%;border:0;background:var(--blush);display:grid;place-items:center;cursor:pointer}
.word button svg{width:17px;height:17px;color:var(--rose-deep)}
.word b{display:block;font-weight:800}
.word span{color:var(--ink-soft);font-size:.9rem}
.exam-table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);font-size:.92rem}
.exam-table th,.exam-table td{padding:10px 12px;text-align:left;vertical-align:top}
.exam-table th{background:var(--blush);font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.exam-table td{border-top:1px solid var(--line)}
.exam-table td:first-child{font-weight:800}
.exam-table td:nth-child(2){white-space:nowrap}
.empty-state{padding:24px 16px;text-align:center;color:var(--ink-soft);font-weight:700}

/* sheet + toast */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(87,41,58,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:min(30rem,100%);max-height:86vh;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:28px}}
.sheet h2{margin:0 0 8px;font-family:var(--font-display);font-weight:600;font-size:1.5rem;line-height:1.2;padding-right:40px}
.sheet p{margin:0 0 10px}
.sheet ul{margin:0 0 12px;padding-left:1.2em}
.sheet li{margin-bottom:6px}
.sheet .close{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px))}
.secret-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:5px 12px;border-radius:999px;background:#FFF1D6;color:#8A5A12;font-weight:800;font-size:.8rem}
.secret-badge svg{width:15px;height:15px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting b{display:block}
.setting span{font-size:.88rem;color:var(--ink-soft)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:#EBD5DA;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .2s}
.switch input:checked + i{background:var(--rose)}
.switch input:checked + i::after{transform:translateX(22px)}
.switch input:focus-visible + i{outline:3px solid var(--sakura);outline-offset:2px}
.seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:#F6EAED;flex:none}
.seg button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:800;font-size:.84rem;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;max-width:min(26rem,calc(100% - 32px));padding:12px 18px;border-radius:18px;background:var(--ink);color:#fff;font-weight:700;font-size:.94rem;box-shadow:0 14px 30px -12px rgba(87,41,58,.6);animation:up .3s}
.golden{position:fixed;top:-60px;left:0;z-index:40;width:52px;height:52px;border:0;background:none;padding:6px;cursor:pointer;animation:drift 14s linear forwards;filter:drop-shadow(0 0 8px rgba(226,174,78,.9))}
.golden svg{width:100%;height:100%}
@keyframes drift{0%{transform:translate(var(--x0),0) rotate(0)}25%{transform:translate(calc(var(--x0) + 16vw),30vh) rotate(110deg)}50%{transform:translate(calc(var(--x0) - 4vw),58vh) rotate(220deg)}75%{transform:translate(calc(var(--x0) + 20vw),84vh) rotate(300deg)}100%{transform:translate(calc(var(--x0) + 8vw),115vh) rotate(420deg)}}
.golden.still{animation:none;top:auto;left:auto;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.bp{position:fixed;width:16px;height:18px;pointer-events:none;z-index:60}
.bp svg{width:100%;height:100%;display:block}
.pause-screen{text-align:center;padding-top:30px}
.pause-screen .bloom{width:150px;height:150px}

/* ---------- Practice, cheat sheet, extras ---------- */
.pcard{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow);text-align:left;cursor:pointer;transition:transform .15s}
.pcard:hover{transform:translateX(2px)}
.pcard .pi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--blush);color:var(--rose-deep);font-family:var(--font-display);font-weight:600;font-size:.95rem}
.pcard .pi svg{width:22px;height:22px}
.pcard .pt b{display:block;font-family:var(--font-display);font-weight:600;font-size:1.08rem;line-height:1.25}
.pcard .pt span{display:block;font-size:.88rem;font-weight:700;color:var(--ink-soft)}
.pcard.alert{box-shadow:0 0 0 2px var(--rose),0 16px 30px -18px rgba(200,71,110,.7)}
.pcard.alert .pi{background:var(--rose);color:#fff}
.practice-link{margin-top:14px}
.say-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:10px 0 0;font-size:.9rem;font-weight:700;color:var(--ink-soft)}
.hear-row{margin:10px 0 0}
.newwords{margin-top:18px;text-align:left}
.nw-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:8px;margin-top:8px}
.nw{display:grid;grid-template-columns:minmax(0,1fr) 18px;align-items:center;gap:2px 8px;padding:10px 12px;border:0;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);text-align:left;cursor:pointer}
.nw b{font-weight:800;overflow-wrap:break-word;hyphens:auto}
.fineprint{font-size:.84rem;color:var(--ink-soft)}
.nw span{grid-column:1;font-size:.84rem;color:var(--ink-soft);font-weight:700}
.nw svg{grid-column:2;grid-row:1/3;width:18px;height:18px;color:var(--rose-deep)}
.txt.ok{border-color:var(--ok);background:var(--ok-bg)}
.txt.bad{border-color:var(--bad);background:var(--bad-bg)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;font-weight:700;cursor:pointer}
.chk input{accent-color:var(--rose);width:20px;height:20px;margin:0;flex:none}
.selfcheck{margin-top:12px;padding:10px 14px;border-radius:14px;background:#FFF6EC}
.selfcheck h4{margin:0 0 2px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.parts{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.parts li{padding:8px 12px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line);font-weight:700}
.parts li b{display:block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--rose)}
.cheat{display:grid;gap:10px}
.cheat details.tip{margin-top:0}
.cheat .cb{padding:0 14px 14px;font-size:.95rem}
.cheat .cb p{padding:0;margin:0 0 8px}
.cheat .cb ul{margin:0 0 8px;padding-left:1.2em}
.cheat .cb li{margin-bottom:4px}
.scrollx{overflow-x:auto}
.mini{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line);margin:4px 0 10px}
.mini th,.mini td{padding:6px 8px;text-align:left;vertical-align:top}
.mini th{background:var(--blush);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.mini td{border-top:1px solid var(--line)}
.mini td:first-child{font-weight:800;color:var(--rose)}
.links{display:grid;gap:8px;margin-top:10px}
.links a{display:block;padding:10px 14px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);color:var(--ink);font-weight:800;text-decoration:none}
.links a span{display:block;font-weight:600;font-size:.84rem;color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(() => {
"use strict";

/* =====================================================================
   ✿  PERSONALISE HERE  ✿
   Everything she reads that is "from you" lives in CONFIG.
   ===================================================================== */
const CONFIG = {
  herName: "Nuella",      // Her name or nickname. Leave "" and she types it herself in the first letter.
  herCountry: "Malawi",   // Used in one introduction question.
  senderName: "Kelzy",    // Your name. It's the answer to the final puzzle.
  examDate: "",           // "YYYY-MM-DD" shows a countdown, e.g. "2026-11-28". Leave "" to hide it.

  // One clue per letter, in order. A clue "My name has N letters" is added automatically as clue 7.
  clues: [
    { de: "Wir kennen uns schon.", en: "We already know each other." },
    { de: "Ich studiere Computertechnik.", en: "I study computer engineering." },
    { de: "Ich spiele gern Videospiele – so wie du.", en: "I like playing video games, just like you." },
    { de: "Du lachst sehr schön. Wirklich.", en: "You have a really lovely laugh. Really." },
    { de: "Ich weiß: Du lernst gerade sehr viel. Ich finde das super.", en: "I know you're studying a lot right now. I think that's amazing." },
    { de: "Ich schaue gern Anime – am liebsten mit Snacks.", en: "I love watching anime, ideally with snacks." },
    { de: "Meine Lieblingswörter auf Deutsch? „Schmetterlinge im Bauch“.", en: "My favourite German words? 'Butterflies in the stomach.'" },
    { de: "Ich glaube an dich. Du schaffst die Prüfung!", en: "I believe in you. You'll pass the exam!" },
    { de: "Ich bin ein bisschen nervös. Du findest mich bald.", en: "I'm a little nervous. You'll find me soon." },
    { de: "Im letzten Brief steht mein Name.", en: "My name is in the last letter." }
  ],

  // Three hidden secrets: tap the sleeping cat on the tree, tap the cloud on the title page 3×, catch the golden petal.
  secrets: {
    cat:    { title: "Die schlafende Katze", text: "Miau. The cat has been keeping a secret: whoever made this practised one German sentence for a very long time. It's „Du bist süß.“ (You're cute.)" },
    cloud:  { title: "Eine Wolke mit Geheimnis", text: "Random vocabulary, for no reason at all: in German, a crush is called a „Schwarm“. Totally unrelated to anything. Moving on." },
    golden: { title: "Achievement unlocked: Das goldene Blütenblatt", text: "Rare drop! Golden petals almost never spawn. Wünsch dir was: make a wish. (Rare and lovely. Sounds like someone I know.)" }
  },

  // The final letter. {name} = her name, {sender} = your name.
  finalLetter: {
    greeting: "Liebe {name},",
    paragraphs: [
      "it was me. Every good anime needs a plot twist, and this one is mine.",
      "I made this little cherry-blossom trail because you've been working so hard for your exam, and I wanted to give you something that makes you smile in between all the Uhrzeiten and Akkusativ.",
      "You don't have to say anything back. Really, no pressure at all. I just wanted you to know that someone thinks you're pretty amazing, and is cheering for you on exam day.",
      "Viel Erfolg bei der Prüfung. Du schaffst das."
    ],
    closing: "Dein {sender}"
  },

  bonus: {
    de: "Ich habe deinen Brief gefunden.",
    en: "I found your letter.",
    note: "One last German sentence, only if you feel like using it. You could say it to me next time we talk. Or just smile. Both are perfect answers."
  },

  encouragements: [
    { de: "Du schaffst das!", en: "You've got this!" },
    { de: "Schritt für Schritt.", en: "Step by step." },
    { de: "Fehler sind Freunde.", en: "Mistakes are how your brain learns." },
    { de: "Ich bin stolz auf dich.", en: "I'm proud of you." },
    { de: "Dein Deutsch wird jeden Tag besser.", en: "Your German gets better every day." },
    { de: "Kleine Pause? Du hast sie verdient.", en: "Little break? You've earned it." }
  ]
};

/* =====================================================================
   The letters. Task types mirror the Goethe-Zertifikat A1: Start Deutsch 1.
   ===================================================================== */
const tf = (statement, answer, explain, extra = {}) => ({ type: "tf", statement, answer, explain, ...extra });
const mc = (prompt, options, answer, explain, extra = {}) => ({ type: "mc", prompt, options, answer, explain, ...extra });

const MAIL1 = { kind: "mail", subject: "Brief Nummer 2", body: "Liebe {name},\nder nächste Brief ist im Café Rosa in der Lindenstraße 8. Das Café ist von 9 bis 18 Uhr geöffnet, aber montags ist es geschlossen.\nFrag dort nach Herrn Weber. Er hat den Brief für dich. Und bestell einen Kakao – der ist dort super!\nBis bald\n?" };
const MENU1 = { kind: "menu", title: "Café Rosa", lines: ["Heute im Angebot", "Kirschkuchen + Kaffee … 3,50 €", "Kakao … 2,00 €", "Ab 16 Uhr: jeder Kuchen nur 1,50 €"] };

const STAGES = [
  { // 0
    title: "Unter dem Kirschbaum", part: "Sprechen · Teil 1", skill: "sprechen",
    letter: { de: "{greet}\nich habe ein Geheimnis. Unter diesem Kirschbaum liegen elf Briefe. Jeder Brief hat ein Schloss – und der Schlüssel ist Deutsch.\nAber zuerst: Wer bist du? Stell dich bitte vor!", en: "I have a secret. Under this cherry tree lie eleven letters. Every letter has a lock, and the key is German. But first: who are you? Please introduce yourself!" },
    tip: "Sprechen Teil 1: you introduce yourself with keyword cards: Name, Alter, Land, Wohnort, Sprachen, Beruf, Hobby. You may also be asked to spell something, such as your name. Learn one sentence per card by heart.",
    questions: [
      { type: "input", prompt: "Name? · Wie heißt du?", say: "Ich heiße {name}.", explain: "heißen = to be called. In the exam you can start with „Ich heiße …“ or „Mein Name ist …“." },
      mc("Land? · Woher kommst du?", ["aus", "in", "nach"], 0, "„kommen aus“ = to come from. For where you live, use „in“: Ich wohne in …", { sentence: "Ich komme ___ {country}." }),
      mc("Alter? · Wie alt bist du?", ["Ich habe zwanzig Jahre.", "Ich bin zwanzig Jahre alt.", "Ich bin alt zwanzig Jahre."], 1, "German uses „sein“ (to be) for age: Ich bin … Jahre alt. „Ich habe … Jahre“ is a classic trap."),
      mc("Beruf? · Was bist du von Beruf?", ["Student", "Studentin", "Studenten"], 1, "Most job words add -in for women: Student → Studentin, Lehrer → Lehrerin, Arzt → Ärztin.", { sentence: "Ich bin ___." }),
      mc("Sprachen? · Welche Sprachen sprichst du?", ["spreche", "sprichst", "spricht"], 0, "ich spreche · du sprichst · er/sie spricht. The vowel changes for du and er/sie.", { sentence: "Ich ___ Englisch und ein bisschen Deutsch." }),
      mc("The examiner says: „Können Sie das bitte buchstabieren?“ What do you do?", ["Say your name again, slowly", "Spell it letter by letter: A – N – N – A", "Tell them your phone number"], 1, "buchstabieren = to spell. In Sprechen Teil 1 you may be asked to spell something, for example your name. Practise the tricky letters: E (eh), I (ih), J (jott), V (fau), W (weh), Z (tsett).", { say: "" })
    ],
    outro: { de: "Freut mich, {name}! Jetzt kenne ich dich ein bisschen. Ich schicke dir eine E-Mail…", en: "Nice to meet you, {name}! Now I know you a little. I'll send you an email…" },
    words: [["heißen", "to be called"], ["kommen aus", "to come from"], ["das Alter", "age"], ["der Beruf", "job"], ["sprechen", "to speak"], ["buchstabieren", "to spell"]]
  },
  { // 1
    title: "Eine E-Mail für dich", part: "Lesen · Teil 1", skill: "lesen",
    letter: { de: "Liebe {name},\nlies meine E-Mail ganz genau. Was ist richtig, was ist falsch?", en: "Read my email very carefully. What's true, what's false?" },
    tip: "Lesen Teil 1: two short texts (emails, notes) and five statements: Richtig oder Falsch. Read the statement first, then hunt for that one detail: days, times, prices, who does what.",
    questions: [
      tf("Der Brief ist im Café Rosa.", true, "Right in the first line: „Der nächste Brief ist im Café Rosa.“", { ctx: MAIL1 }),
      tf("Das Café ist jeden Tag geöffnet.", false, "„montags ist es geschlossen“: it's closed on Mondays. montags = every Monday.", { ctx: MAIL1 }),
      tf("Eine Kellnerin hat den Brief.", false, "Herr Weber has it. „Herr“ = Mr, so it's a man, not a Kellnerin (waitress).", { ctx: MAIL1 }),
      tf("Ein Kakao kostet heute zwei Euro fünfzig.", false, "2,00 € = zwei Euro. Zwei Euro fünfzig would be 2,50 €.", { ctx: MENU1 }),
      tf("Am Nachmittag ist der Kuchen billiger.", true, "Ab 16 Uhr (from 4 p.m.) every cake is only 1,50 €. Nachmittag = afternoon, billiger = cheaper.", { ctx: MENU1 })
    ],
    outro: { de: "Du gehst ins Café Rosa. Es riecht nach Kakao und Kuchen. Aber Herr Weber ist noch nicht da… Hör gut zu!", en: "You walk into Café Rosa. It smells of cocoa and cake. But Herr Weber isn't here yet… Listen closely!" },
    words: [["geöffnet", "open"], ["geschlossen", "closed"], ["montags", "on Mondays"], ["das Angebot", "special offer"], ["billiger", "cheaper"]]
  },
  { // 2
    title: "Stimmen im Café", part: "Hören · Teil 1", skill: "hoeren", plays: 2,
    letter: { de: "Liebe {name},\nim Café sprechen viele Leute. Hör gut zu und finde die richtige Antwort.", en: "Lots of people are talking in the café. Listen closely and find the right answer." },
    tip: "Hören Teil 1: six short dialogues, answer a, b or c. You hear each one twice. The wrong options are usually mentioned too, so listen to the end before you choose.",

/* name puzzle */
function nameLetters() { return (CONFIG.senderName || "").toLocaleUpperCase("de-DE").replace(/[^A-ZÄÖÜ]/g, "").split(""); }
function scrambled() {
  const L = nameLetters(); if (L.length < 2) return L;
  let s = shuffleSeed(L, 4711);
  if (s.join("") === L.join("")) s = s.slice(1).concat(s[0]);
  return s;
}
function letterPlan() {
  const s = scrambled(), L = Math.min(s.length, N), plan = {};
  for (let k = 0; k < L; k++) plan[Math.floor((k + 1) * N / L) - 1] = s[k];
  return plan;
}
function clueList() {
  const nums = ["null", "einen", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn"];
  const L = nameLetters().length;
  const nameClue = { de: `Mein Name hat ${nums[L] || L} Buchstaben.`, en: `My name has ${L} letter${L === 1 ? "" : "s"}.` };
  const base = (CONFIG.clues || []).slice(0, 10);
  while (base.length < 10) base.push({ de: "Du findest mich bald.", en: "You'll find me soon." });
  base.splice(6, 0, nameClue);
  return base;
}

function countdownHTML() {

  if (isNaN(d)) return "";

}

const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const ONES = ["null", "eins", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf", "dreizehn", "vierzehn", "fünfzehn", "sechzehn", "siebzehn", "achtzehn", "neunzehn"];
const TENS = ["", "", "zwanzig", "dreißig", "vierzig", "fünfzig", "sechzig", "siebzig", "achtzig", "neunzig"];
const deNum = n => n < 20 ? ONES[n] : n === 100 ? "hundert" : (n % 10 ? (n % 10 === 1 ? "ein" : ONES[n % 10]) + "und" : "") + TENS[Math.floor(n / 10)];
const deEuro = (e, c) => (e === 1 ? "ein" : deNum(e)) + " Euro" + (c ? " " + deNum(c) : "");
const hw = h => ONES[((h + 11) % 12) + 1];                  // any hour -> "eins" … "zwölf"
const face = h => ((h + 11) % 12) + 1;                       // any hour -> 1…12 on the clock face
const deClock = (h, m) => m === 0 ? (face(h) === 1 ? "ein" : hw(h)) + " Uhr" : m === 15 ? "Viertel nach " + hw(h) : m === 30 ? "halb " + hw(h + 1) : "Viertel vor " + hw(h + 1);
const squash = s => s.toUpperCase().replace(/Ä/g, "AE").replace(/Ö/g, "OE").replace(/Ü/g, "UE").replace(/ß/g, "SS").replace(/[^A-Z]/g, "");
const LETTER_NAME = { A: "ah", B: "beh", C: "tseh", D: "deh", E: "eh", F: "eff", G: "geh", H: "hah", I: "ih", J: "jott", K: "kah", L: "ell", M: "emm", N: "enn", O: "oh", P: "peh", Q: "kuh", R: "err", S: "ess", T: "teh", U: "uh", V: "fau", W: "weh", X: "iks", Y: "üpsilon", Z: "tsett", Ä: "ä", Ö: "ö", Ü: "ü" };
const SPELL_WORDS = ["BLÜTENBERG", "MALAWI", "KÖLN", "MÜLLER", "SCHMIDT", "WEBER", "ZÜRICH", "HAMBURG", "SOMMER", "FISCHER", "BRANDT", "ROSENWEG"];

/* a typed answer: she hears (or reads) something and types it. `check` decides, `show` is the model answer */
const typed = (prompt, sub, audio, text, expect, show, check, explain, extra = {}) => ({ type: "typed", prompt, sub, audio, text, expect, show, check, explain, ...extra });
function numberQ(n) {
  const w = deNum(n), o = n % 10;
  const why = n < 20 ? `${w} = ${n}. The ending -zehn means 10 + something: vierzehn = 14, but vierzig = 40.`
    : o === 0 ? `${w} = ${n}. The ending -zig means a full ten: vierzig = 40, but vierzehn = 14.`
    : `${w} = ${n}. German says the ones first: ${o === 1 ? "ein" : ONES[o]} + und + ${TENS[Math.floor(n / 10)]}.`;
  return typed("Hör zu. Welche Zahl hörst du?", "Type the digits.", [["f", w]], w, String(n), String(n), v => v.replace(/\s/g, "") === String(n), why, { mode: "numeric" });
}
function priceQ(e, c) {
  const w = deEuro(e, c), eur = e + "," + String(c).padStart(2, "0");
  return typed("Wie viel kostet das?", "Type the price in euros, like 2,20.", [["m", w]], w, eur, eur + " €", v => Math.abs(parseFloat(v.replace(",", ".").replace(/[^\d.]/g, "")) - (e + c / 100)) < 0.001, `„${w}“ = ${eur} €. Euros first, then the cents. There is no „und“ in between.`, { mode: "decimal" });
}
function phoneQ() {
  const p = [rnd(10, 99), rnd(10, 99), rnd(10, 99)], d = p.join(""), w = p.map(deNum).join(", ");
  return typed("Hör zu. Wie ist die Nummer?", "Type the six digits. Phone numbers are read in pairs.", [["m", w]], w, d, p.join(" "), v => v.replace(/\D/g, "") === d, `${w} = ${p.join(" ")}. Each pair is one number: ${deNum(p[0])} = ${p[0]}.`, { mode: "numeric" });
}
function timeQ() {
  const h = rnd(1, 12), m = pick([0, 15, 30, 45]), w = deClock(h, m), mm = String(m).padStart(2, "0");
  const wrong = { 0: [[h, 30], [h, 15]], 15: [[h, 45], [h + 1, 15]], 30: [[h + 1, 30], [h, 0]], 45: [[h + 1, 15], [h - 1, 45]] }[m];
  const note = { 0: "", 15: " (a quarter past)", 30: " (half TO the next hour)", 45: " (a quarter TO the next hour)" }[m];
  return mc("Wie spät ist es?", [[h, m], ...wrong].map(([a, b]) => ({ clock: [face(a), b] })), 0, `„${w.charAt(0).toUpperCase() + w.slice(1)}“ = ${face(h)}:${mm}${note}.`, { audio: [["f", "Es ist " + w + "."]] });
}
function spellQ(word) {
  const L = word.split(""), tricky = [...new Set(L.filter(c => "CEIJQUVWXYZÄÖÜ".includes(c)))];
  return typed("Hör zu. Die Frau buchstabiert ein Wort. Welches Wort ist es?", "Type the word. You may write ae, oe, ue for ä, ö, ü.", L.map(c => ["f", c]), L.join(" – "), word, word, v => squash(v) === squash(word), L.join(" – ") + (tricky.length ? ". Tricky letters: " + tricky.map(c => `${c} (${LETTER_NAME[c]})`).join(", ") + "." : "."), { gap: 520 });
}
function numberItems() {
  const k = rnd(3, 9), compound = () => { let n; do n = rnd(21, 99); while (n % 10 === 0); return n; };
  const price = () => priceQ(rnd(1, 19), pick([10, 20, 30, 40, 50, 60, 70, 80, 90]));
  return shuffle([numberQ(k + 10), numberQ(k * 10), numberQ(compound()), price(), price(), phoneQ(), timeQ(), timeQ()]).map(q => ({ q }));
}
function spellItems(n) {

  return shuffle(SPELL_WORDS.concat(mine.length > 2 && mine.length < 13 ? [mine] : [])).slice(0, n).map(w => ({ q: spellQ(w) }));
}

  return shuffle(pool).slice(0, n).map(([de, en], k) => {

    const wrong = shuffle(all.filter(w => w[0] !== de && w[1] !== en)).slice(0, 2).map(w => toEn ? w[1] : w[0]);
    const options = shuffle([right, ...wrong]);

/* =====================================================================
   Speech (listening tasks use the phone's own German voice)
   ===================================================================== */
const TTS = {
  ok: typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined",
  de: [], f: null, m: null, token: 0,
  init() {
    if (!this.ok) return;
    const load = () => {
      try {
        const vs = speechSynthesis.getVoices() || [];
        this.de = vs.filter(v => /^de([-_]|$)/i.test(v.lang || ""));
        const fem = /(anna|petra|helena|katja|marlene|vicki|hedda|female|sabine|elena|amala|seraphina|katharina|ingrid|eva)/i;
        const mal = /(markus|yannick|conrad|stefan|hans|male|martin|florian|killian|daniel|jonas|viktor|bernd)/i;
        this.f = this.de.find(v => fem.test(v.name)) || this.de[0] || null;
        this.m = this.de.find(v => mal.test(v.name) && v !== this.f) || this.de.find(v => v !== this.f) || this.f;
      } catch (e) {}
    };
    load();
    try { speechSynthesis.addEventListener("voiceschanged", load); } catch (e) { try { speechSynthesis.onvoiceschanged = load; } catch (e2) {} }
  },
  speak(lines, cb = {}) {
    if (!this.ok) { cb.onEnd && cb.onEnd(false); return false; }
    const busy = (() => { try { return speechSynthesis.speaking || speechSynthesis.pending; } catch (e) { return false; } })();
    this.stop();
    const token = ++this.token;
    let i = 0;
    const twoVoices = this.f && this.m && this.f !== this.m;
    const next = () => {
      if (token !== this.token) return;
      if (i >= lines.length) { cb.onEnd && cb.onEnd(true); return; }
      const [who, text, say] = lines[i++];
      try {
        const u = new SpeechSynthesisUtterance(fill(say || text));
        u.lang = "de-DE";
        const v = who === "m" ? this.m : this.f;
        if (v) u.voice = v;
        u.rate = state.settings.rate;
        u.pitch = who === "m" ? (twoVoices ? 1 : 0.78) : who === "f" ? (twoVoices ? 1.05 : 1.25) : 1;
        u.onend = () => setTimeout(next, cb.gap || 260);
        u.onerror = () => { if (token === this.token) cb.onEnd && cb.onEnd(false); };
        this.keep = u;   // Chrome can lose the end-callback of an utterance nobody references, which would cut a dialogue off after its first line
        speechSynthesis.speak(u);
      } catch (e) { cb.onEnd && cb.onEnd(false); }
    };
    cb.onStart && cb.onStart();
    if (busy) setTimeout(next, 90); else next();   // some Android builds swallow a speak() that follows cancel() at once
    return true;
  },
  stop() { if (this.ok) { this.token++; try { speechSynthesis.cancel(); } catch (e) {} } }
};

function drawBranch() {

  const r0 = tree.getBoundingClientRect();

  const H = tree.offsetHeight, W = tree.offsetWidth;

  svg.style.height = H + "px";

  const start = [pts[0][0] + 2, 58];
  let d = `M${start[0]} ${start[1]} C${start[0] - 14} ${start[1] + 20} ${pts[0][0] + 14} ${pts[0][1] - 30} ${pts[0][0]} ${pts[0][1]}`;
  let twigs = "", blooms = "";
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], dy = y2 - y1, sw = (i % 2 ? 1 : -1) * 22;

    const mx = .125 * x1 + .375 * c1[0] + .375 * c2[0] + .125 * x2, my = .125 * y1 + .375 * c1[1] + .375 * c2[1] + .125 * y2;
    const dir = sw > 0 ? -1 : 1, ex = mx + dir * 20, ey = my - 12;

  }

const WRITE_CHECKS = [
  ["anrede", "Anrede", t => /^\s*(liebe|lieber|hallo|hi|hey|sehr geehrte|guten tag|servus|moin)\b/i.test(t)],
  ["gruss", "Gruß", t => { const L = t.trim().split("\n"); return /(grüße|gruß|bis (bald|dann|morgen)|tschüss|ciao|auf wiedersehen|\blg\b|\bvg\b)/i.test(L.slice(-2).join(" ")) || /^\s*deine?\s+\p{L}+\s*$/iu.test(L[L.length - 1]); }],
  ["words", "ca. 30 Wörter", t => wordCount(t) >= 25],
  ["frage", "Eine Frage (?)", t => /\?/.test(t)]
];
function wordCount(t) { const m = String(t).match(/[\p{L}\p{N}]+(?:['’-][\p{L}\p{N}]+)*/gu); return m ? m.length : 0; }
function checksHTML(t) {
  return WRITE_CHECKS.map(([k, l, f]) => `<span class="${f(t) ? "on" : ""}" data-check="${k}">${icon("i-check", "ico")}${l}</span>`).join("");
}
function renderWriteQ(q) {
  const t = q.task, draft = state.draft || "";
  let h = `<div class="task"><p>${esc(t.de)}</p><ul>${t.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul><p>${esc(t.de2)}</p><p class="en">${esc(t.en)}</p></div>
  <label class="sr" for="letterTxt">Dein Brief</label>
  <textarea class="txt" id="letterTxt" placeholder="Lieber Briefschreiber, …" ${ui.writeChecked ? "readonly" : ""} style="margin-top:14px">${esc(draft)}</textarea>
  <div class="wc"><span id="wcNum">${wordCount(draft)} Wörter</span><span>Nur du siehst diesen Text.</span></div>
  <div class="checks" id="checks">${checksHTML(draft)}</div>`;
  if (!ui.writeChecked) {
    h += `<div class="selfcheck"><h4>Alle Punkte dabei?</h4>${t.points.map((p, k) => `<label class="chk"><input type="checkbox" data-pt="${k}" ${ui.pts[k] ? "checked" : ""}>${esc(p)}</label>`).join("")}</div>
    <div class="actions"><button class="btn wide" data-action="check-write" id="writeBtn" ${wordCount(draft) < 8 ? "disabled" : ""}>Fertig</button></div>`;
  } else {
    const passed = WRITE_CHECKS.filter(c => c[2](draft)).length;
    const allPts = t.points.every((_, k) => ui.pts[k]);
    const extra = `<div class="scoring"><h4>So wird bewertet</h4><p>In the exam, graders check three things: did you cover every point, can the reader understand you, and did you use a greeting and a sign-off. Perfect grammar isn't required, but a missing point costs marks.</p></div>
      <article class="letter" style="margin-top:14px"><div class="letter-head"><span class="eyebrow">Beispiel · Model answer</span></div><div class="hand">${paras(q.model)}</div></article>
      <ul class="parts">${q.parts.map(([k, s]) => `<li><b>${esc(k)}</b>${esc(fill(s))}</li>`).join("")}</ul>
      <div class="actions"><button class="btn soft" data-action="copy-letter">${icon("i-copy")}Meinen Text kopieren</button></div>`;
    h += feedbackHTML(passed >= 3, `${passed} von 4 Checks erfüllt.${allPts ? "" : " You didn't tick every point. In the exam, give each point its own sentence."} Want to actually send it to him? Copy your text below. Totally up to you.`, extra);
  }
  return h;
}

/* ---------- Reward ---------- */
function renderReward(i, st) {
  const r = ui.reward || { stars: (state.done[i] || {}).stars || 1, correct: (state.done[i] || {}).correct || 0, total: stageTotal(st), gained: 0 };
  const clue = clueList()[i];
  const letter = letterPlan()[i];
  const enc = CONFIG.encouragements[(i * 5 + 3) % CONFIG.encouragements.length];
  const nextI = i + 1;
  const d = countDone();
  const showBreak = r.firstTime && d % 3 === 0 && d < N;
  const miss = missedList().filter(([s]) => s === i).length;
  return `<section class="reward">
    <div class="bloom">${flower(i % 2 === 1)}</div>
    <p class="eyebrow">${label(i)} · geschafft</p>
    <h1 class="h1">${r.stars === 3 ? "Wunderbar!" : r.stars === 2 ? "Sehr schön!" : "Geschafft!"}</h1>
    <div class="stars" aria-label="${r.stars} von 3 Sternen">${[0, 1, 2].map(k => `<svg viewBox="0 0 24 24" class="${k < r.stars ? "st-on" : "st-off"}" aria-hidden="true"><use href="#i-star"/></svg>`).join("")}</div>
    <p class="score">${r.correct} von ${r.total} richtig${r.gained ? ` · +${r.gained} Blütenblätter` : ""}</p>
    <article class="letter">
      <div class="letter-head"><span class="eyebrow">Was passiert?</span><button class="chip" data-action="toggle-en" aria-pressed="${ui.showEn}">Übersetzung</button></div>
      <div class="hand">${paras(st.outro.de)}</div>
      ${ui.showEn ? `<p class="en">${txt(st.outro.en)}</p>` : ""}
    </article>
    <div class="clue">
      <svg class="corner" viewBox="0 0 100 100" aria-hidden="true"><use href="#sakura"/></svg>
      <p class="eyebrow">${icon("i-spark")}Hinweis ${i + 1} von ${N}</p>
      <p class="clue-de">${esc(fill(clue.de))}</p>
      <p class="en">${esc(fill(clue.en))}</p>
    </div>
    ${letter ? `<div class="petal-letter"><div class="pl-big">${PETAL_LETTER_BG}<b>${esc(letter)}</b></div><p>Ein Blütenblatt mit einem Buchstaben!<span>A petal with a letter on it. Keep it, you'll need it for the last letter.</span></p></div>` : ""}
    <div class="newwords"><p class="eyebrow">Neue Wörter</p><div class="nw-list">${st.words.map(([de, en]) => `<button class="nw" data-action="say" data-say="${esc(de)}"><b>${esc(de)}</b><span>${esc(en)}</span>${icon("i-speaker", "ico")}</button>`).join("")}</div></div>
    ${miss ? `<div class="break"><h3>Nochmal versuchen?</h3><p>You missed ${miss} ${miss === 1 ? "question" : "questions"} in this letter. Try ${miss === 1 ? "it" : "them"} again now: that's how answers stick.</p><div class="actions"><button class="btn soft" data-action="drill-mistakes" data-stage="${i}">Fehler üben</button></div></div>` : ""}
    <p class="encourage">${esc(enc.de)}<span>${esc(enc.en)}</span></p>
    ${showBreak ? `<div class="break"><h3>Lernpause?</h3><p>You've opened ${d} letters. The tree will wait, and your progress is saved. Maybe stretch, drink a glass of water, and go back to your notes for a bit?</p><div class="actions"><button class="btn soft" data-action="pause">Pause machen</button></div></div>` : ""}
    <div class="actions">
      ${nextI < N ? `<button class="btn wide" data-action="open-stage" data-i="${nextI}">Nächster Brief</button>` : `<button class="btn wide" data-action="open-finale">Zum letzten Brief</button>`}
      <button class="btn soft" data-action="map">Zum Baum</button>
    </div>
  </section>`;
}

/* ---------- Finale ---------- */
function renderFinale() {
  if (state.finale && !ui.fin.opening) return renderReveal();
  const letters = scrambled();
  const L = nameLetters();
  const slots = ui.fin.slots;
  const clues = clueList();
  const tips = ui.fin.tries >= 2 ? `<p class="sub" style="text-align:center;margin-top:6px">Tipp: Der Name beginnt mit „${esc(L.slice(0, Math.min(ui.fin.tries - 1, L.length - 1)).join(""))}…“</p>` : "";
  return `<div class="stage-top"><button class="icon-btn" data-action="map" aria-label="Zurück zum Baum">${icon("i-back")}</button><div class="meta"><b>Brief 11 · Wer bin ich?</b><span>Der letzte Brief</span></div></div>
  <section style="text-align:center">
    <div class="env-static" style="margin-top:6px">${ENV_STATIC}</div>
    <h1 class="h1">Der letzte Brief</h1>
    <p class="sub">Auf dem Umschlag steht: <b>„Buchstabiere meinen Namen.“</b><br>On the envelope it says: “Spell my name.” Tap the petals in the right order.</p>
  </section>
  <details class="fin-clues"><summary>Deine Hinweise (${clues.length})</summary><ol>${clues.map(c => `<li>${esc(fill(c.de))}<span>${esc(fill(c.en))}</span></li>`).join("")}</ol></details>
  <div class="slots" id="slots">${L.map((_, k) => `<button class="slot ${slots[k] != null ? "filled" : ""}" data-action="slot" data-k="${k}" aria-label="Feld ${k + 1}">${slots[k] != null ? esc(letters[slots[k]]) : ""}</button>`).join("")}</div>
  <div class="pletters">${letters.map((ch, k) => `<button class="pbtn" data-action="petal" data-k="${k}" ${slots.includes(k) ? "disabled" : ""} aria-label="Buchstabe ${esc(ch)}">${PETAL_LETTER_BG}<b>${esc(ch)}</b></button>`).join("")}</div>

/* ---------- Box ---------- */
function renderBox() {
  const tabs = [["clues", "Hinweise"], ["words", "Wörter"], ["cheat", "Spickzettel"], ["secrets", "Geheimnisse"], ["exam", "Prüfung"]];
  let h = `<div class="stage-top"><button class="icon-btn" data-action="back-from-box" aria-label="Zurück">${icon("i-back")}</button><div class="meta"><b>Schatzkiste</b><span>Everything you've collected</span></div></div>
  <h1 class="h1">Deine <em>Schatzkiste</em></h1>
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${ui.boxTab === k}" data-action="tab" data-tab="${k}">${l}</button>`).join("")}</div>`;
  if (ui.boxTab === "clues") {
    const clues = clueList(), plan = letterPlan();
    const got = Object.keys(plan).filter(k => isDone(+k)).map(k => plan[k]);
    const total = Math.min(nameLetters().length, N);
    h += `<div class="item"><p class="eyebrow">Gesammelte Buchstaben</p><div class="collected">${Array.from({ length: total }, (_, k) => got[k] ? `<span>${esc(got[k])}</span>` : `<span class="empty">?</span>`).join("")}</div></div><div class="list" style="margin-top:10px">`;
    clues.forEach((c, k) => {
      h += isDone(k) ? `<div class="item"><p class="eyebrow">Hinweis ${k + 1} · ${label(k)}</p><p class="de">${esc(fill(c.de))}</p><p class="en">${esc(fill(c.en))}</p></div>`
        : `<div class="item locked"><p class="eyebrow">Hinweis ${k + 1}</p><p class="de">Noch versteckt in ${label(k) === "Prolog" ? "dem Prolog" : label(k)}</p></div>`;
    });
    h += `</div>`;

function renderTypedQ(q) {

function renderDrill() {

function renderDrillDone(d) {

}

/* =====================================================================
   Sheets, toasts, bursts
   ===================================================================== */
let lastFocus = null;
function openSheet(html) {
  closeSheet();
  lastFocus = document.activeElement;
  const w = document.createElement("div");
  w.className = "sheet-wrap"; w.id = "sheet";
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><button class="icon-btn close" data-action="close-sheet" aria-label="Schließen">${icon("i-close")}</button>${html}</div>`;
  w.addEventListener("click", e => { if (e.target === w) closeSheet(); });
  document.body.appendChild(w);
  w.querySelector(".sheet").focus();
}
function closeSheet() { const s = $("#sheet"); if (s) { s.remove(); if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} } }
let toastT = null;
function toast(msg, ms = 2800) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
}
const BURST_COLORS = ["#F7A9C0", "#FBC9D7", "#FFD0B8", "#F59AB5", "#FFE3EA"];
function burst(x, y, n = 14, gold = false) {
  if (reduceMotion) return;
  for (let k = 0; k < n; k++) {
    const el = document.createElement("span");
    el.className = "bp";
    el.innerHTML = petalSVG(gold && k % 3 === 0 ? "#F2C766" : pick(BURST_COLORS));
    el.style.left = x + "px"; el.style.top = y + "px";
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 100;
    const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist - 40;
    try {
      el.animate([
        { transform: "translate(-50%,-50%) rotate(0deg) scale(.5)", opacity: 1 },
        { transform: `translate(calc(-50% + ${dx.toFixed(0)}px), calc(-50% + ${(dy + 80).toFixed(0)}px)) rotate(${((Math.random() - .5) * 600).toFixed(0)}deg) scale(1)`, opacity: 0 }
      ], { duration: 1000 + Math.random() * 700, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => el.remove();
    } catch (e) { el.remove(); }
  }
}
function burstFrom(el, n, gold) { if (!el) return; const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n, gold); }

/* =====================================================================
   Game flow
   ===================================================================== */
function openStage(i) {
  if (!unlocked(i)) { toast(`Dieser Brief ist noch zu. Open ${label(i - 1)} first.`); return; }
  const st = STAGES[i], resume = state.cur && state.cur.stage === i;
  if (resume && state.cur.qi >= st.questions.length) {   // she answered the last question and left before opening the letter: finish it now
    TTS.stop(); closeSheet();
    Object.assign(ui, { screen: "stage", stage: i, qi: st.questions.length - 1, correct: state.cur.correct, reward: null });
    return completeStage();
  }
  go("stage", { stage: i, phase: resume ? "q" : "intro", qi: resume ? state.cur.qi : 0, correct: resume ? state.cur.correct : 0, answered: false, picked: null, plays: 0, showT: false, showEn: false, form: {}, formChecked: false, writeChecked: false, pts: [], reward: null });
}
function startQuestions() {
  state.cur = { stage: ui.stage, qi: 0, correct: 0 }; save();
  Object.assign(ui, { phase: "q", qi: 0, correct: 0, answered: false, picked: null, plays: 0, showT: false, pts: [] });
  render();
}
function answer(ok, gain) {
  ui.answered = true; ui.lastOk = ok;
  ui.fbWord = ok ? pick(OK_WORDS) : pick(BAD_WORDS);
  if (inDrill()) {
    const it = curItem();
    if (ok) { ui.drill.right++; state.petals++; }
    if (it.ref) { if (ok) delete state.missed[it.ref]; else state.missed[it.ref] = 1; }   // wrong ones stay in the notebook until she gets them right
  } else {
    ui.correct += gain;
    state.petals += gain;
    state.cur = { stage: ui.stage, qi: ui.qi + 1, correct: ui.correct };
    if (/^(tf|mc)$/.test(curQ().type)) { if (ok) delete state.missed[ui.stage + ":" + ui.qi]; else state.missed[ui.stage + ":" + ui.qi] = 1; }
  }
  save();
  const y = window.scrollY;
  render({ keepScroll: true });
  window.scrollTo(0, y);
  const fb = $("#fb");
  if (fb) { try { fb.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" }); } catch (e) {} }
  const nb = $("#nextBtn"); if (nb) try { nb.focus({ preventScroll: true }); } catch (e) {}
}
function nextQuestion() {
  TTS.stop();
  if (inDrill()) {
    const d = ui.drill;
    d.pos++;
    if (d.pos >= d.items.length) { d.done = true; render(); setTimeout(() => burst(window.innerWidth / 2, 150, 26), 250); return; }
    Object.assign(ui, { qi: d.pos, answered: false, picked: null, plays: 0, showT: false, fbWord: null, typedVal: "" });
    return render();
  }
  const st = STAGES[ui.stage];
  if (ui.qi + 1 >= st.questions.length) return completeStage();
  Object.assign(ui, { qi: ui.qi + 1, answered: false, picked: null, plays: 0, showT: false, fbWord: null });
  render();
}
function startDrill(kind, title, items) {
  go("drill", { drill: { kind, title, items, pos: 0, right: 0, done: false, seed: rnd(100, 9999) }, qi: 0, answered: false, picked: null, plays: 0, showT: false, fbWord: null, typedVal: "" });
}
function completeStage() {
  const i = ui.stage, st = STAGES[i], total = stageTotal(st), correct = Math.min(ui.correct, total);
  const ratio = correct / total, stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : 1;
  const firstTime = !isDone(i);
  const prev = state.done[i];
  const bonus = stars === 3 && (!prev || prev.stars < 3) ? 3 : 0;
  state.petals += bonus;
  if (!prev || stars >= prev.stars) state.done[i] = { stars, correct, total };
  state.cur = null;
  save();
  ui.reward = { stars, correct, total, gained: correct + bonus, firstTime };
  ui.phase = "reward"; ui.showEn = false;
  render();
  setTimeout(() => burst(window.innerWidth / 2, 150, 26), 250);
}
function revealSecret(id) {
  const s = CONFIG.secrets[id]; if (!s) return;
  const fresh = !state.secrets.includes(id);
  if (fresh) { state.secrets.push(id); state.petals += 5; save(); updateHud(); }
  openSheet(`<span class="secret-badge">${icon("i-spark")} Geheimnis ${state.secrets.indexOf(id) + 1} von 3${fresh ? " · +5 Blüten" : ""}</span><h2>${esc(s.title)}</h2><p>${esc(fill(s.text))}</p><div class="actions"><button class="btn wide" data-action="close-sheet">Psst. Weiter.</button></div>`);
}

function checkName() {
